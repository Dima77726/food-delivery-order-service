# Значения переменных окружения для тестов.
#
# В application.yml у учётных данных нет значений по умолчанию: забытая переменная должна
# останавливать приложение, а не подставлять пароль из репозитория. Тестам подставлять
# переменные всё равно нужно, и этот файл — единственное место, где это делается.
#
# Настоящих учётных данных здесь нет и быть не может: адреса и пароли контейнеров
# подставляют Testcontainers (см. TestcontainersConfiguration), они перекрывают эти значения.

# Учётные данные PostgreSQL: их перекрывает @ServiceConnection, но плейсхолдеры
# в application.yml должны разрешаться и до того, как контейнер поднимется.
ORDER_DB_USER=test
ORDER_DB_PASSWORD=test

# gRPC-сервер на случайном свободном порту: фиксированный конфликтовал бы с сервисом,
# запущенным из IDE, и с соседними контекстами тестов.
spring.grpc.server.port=0
