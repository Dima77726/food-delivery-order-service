spring:
  application:
    name: order-service

  lifecycle:
    # Согласовано с stop_grace_period в docker-compose.yml.
    timeout-per-shutdown-phase: 20s

  datasource:
    # Своя база заказов (database-per-service): корзины, заказы, доставки, их история и outbox.
    url: jdbc:postgresql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:5432}/${ORDER_DB_NAME:orders}
    username: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
    hikari:
      # Соединения держат веб-потоки, слушатель Kafka, публикаторы outbox и журнала аудита и задача таймаутов оплаты.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      leak-detection-threshold: 20000

  liquibase:
    change-log: classpath:/db/changelog/changelog.yml

  data:
    redis:
      # Присутствие курьеров и гео-индекс для автоназначения, коэффициент спроса. Соединение ленивое.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  batch:
    # Задания запускаются расписанием и администратором, а не при старте приложения.
    job:
      enabled: false
    # Таблицы BATCH_* создаёт Liquibase (миграция 005), а не инициализатор Spring Batch.
    jdbc:
      initialize-schema: never

  grpc:
    server:
      # Чтение заказов и доставок для монолита. По умолчанию — для запуска из IDE,
      # в docker-compose переопределяется на 9090.
      port: ${GRPC_PORT:7086}
    client:
      channels:
        # Каталог: корзина спрашивает у него ресторан и блюдо.
        catalog:
          address: ${CATALOG_GRPC_ADDRESS:static://localhost:7084}
          negotiation-type: plaintext
        # Сервис пользователей: права на ресторан для заказов ресторана и доставки.
        identity:
          address: ${IDENTITY_GRPC_ADDRESS:static://localhost:7085}
          negotiation-type: plaintext

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

    template:
      # Отправка и получение сообщений становятся спанами, а traceparent едет заголовком
      # сообщения: трассу можно проследить из одного сервиса в другой через Kafka.
      observation-enabled: true

    producer:
      # Потеря команды «спиши» или события заказа недопустима: подтверждение от всех реплик
      # и идемпотентный продюсер — см. пояснения в application.yml монолита в истории git.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    consumer:
      # Своя группа: исходы платежей читает только сервис заказов.
      group-id: ${KAFKA_CONSUMER_GROUP:order-service}
      auto-offset-reset: earliest
      properties:
        max.poll.records: 50

    listener:
      ack-mode: record
      observation-enabled: true

app:
  grpc:
    catalog:
      deadline: ${CATALOG_GRPC_DEADLINE:PT2S}
    identity:
      deadline: ${IDENTITY_GRPC_DEADLINE:PT2S}

  outbox:
    publish-interval: ${OUTBOX_PUBLISH_INTERVAL:PT2S}
    publish-enabled: ${OUTBOX_PUBLISH_ENABLED:true}

  audit:
    # Журнал аудита уезжает в сводный журнал insights-service. Спешить некуда: администратор
    # смотрит журнал не в реальном времени, а пачка раз в несколько секунд дешевле.
    publish-interval: ${AUDIT_PUBLISH_INTERVAL:PT5S}
    publish-enabled: ${AUDIT_PUBLISH_ENABLED:true}

  saga:
    # Сколько заказ может ждать оплаты — и в статусе CREATED, и в PAYMENT_PENDING. По истечении
    # заказ отменяется, а если оплату уже запросили — сервису платежей уходит команда на возврат.
    payment-timeout: ${PAYMENT_TIMEOUT:PT15M}
    timeout-check-interval: ${PAYMENT_TIMEOUT_CHECK_INTERVAL:PT1M}
    timeout-check-enabled: ${PAYMENT_TIMEOUT_CHECK_ENABLED:true}
    # Кто ведёт ожидание исхода оплаты: native — этот сервис (PaymentSaga + PaymentTimeoutJob),
    # camunda — процесс order-lifecycle в Camunda 8 (пакет order.saga.camunda). Вместе с camunda
    # нужно включить клиент: CAMUNDA_CLIENT_ENABLED=true.
    engine: ${SAGA_ENGINE:native}
    # Только для camunda: сколько оплаченный заказ может ждать ресторана, прежде чем процесс
    # поднимет эскалацию (метрика orders.acceptance.overdue). Заказ при этом не отменяется.
    acceptance-sla: ${ORDER_ACCEPTANCE_SLA:PT10M}

  live:
    # Живые обновления: SSE заказа и доски ресторана, long polling свободных доставок.
    # Сигналы между экземплярами — LISTEN/NOTIFY PostgreSQL (см. LiveSignals).
    enabled: ${LIVE_ENABLED:true}
    # Пульс короче таймаутов прокси по пути: nginx по умолчанию рвёт молчащее соединение через 60 с.
    heartbeat: ${LIVE_HEARTBEAT:PT15S}
    stream-timeout: ${LIVE_STREAM_TIMEOUT:PT30M}
    max-streams: ${LIVE_MAX_STREAMS:500}
    max-poll-timeout: ${LIVE_MAX_POLL_TIMEOUT:PT30S}

  pricing:
    # Цена доставки = база × коэффициент спроса (1.0–2.0, шаг 0.1); фиксируется в заказе при оформлении.
    base-delivery-fee: ${PRICING_BASE_DELIVERY_FEE:149}
    max-surge: ${PRICING_MAX_SURGE:2.0}
    surge-interval: ${PRICING_SURGE_INTERVAL:PT30S}
    max-tip: ${PRICING_MAX_TIP:3000}
    # Заказ ко времени: не раньше чем через 45 минут и не дальше недели; принять можно за час до срока.
    schedule-min-lead: ${PRICING_SCHEDULE_MIN_LEAD:PT45M}
    schedule-max-ahead: ${PRICING_SCHEDULE_MAX_AHEAD:P7D}
    accept-window: ${PRICING_ACCEPT_WINDOW:PT60M}

  settlement:
    # Ежедневные расчёты с ресторанами (Spring Batch, пакет settlement).
    commission-rate: ${SETTLEMENT_COMMISSION_RATE:0.15}
    zone: ${SETTLEMENT_ZONE:Europe/Moscow}
    schedule-cron: ${SETTLEMENT_CRON:0 0 3 * * *}
    storage:
      # CSV в MinIO (бакет settlements). Выключено по умолчанию: из IDE MinIO может не быть.
      enabled: ${SETTLEMENT_STORAGE_ENABLED:false}
      endpoint: ${SETTLEMENT_S3_ENDPOINT:http://localhost:9000}
      access-key: ${SETTLEMENT_S3_ACCESS_KEY:}
      secret-key: ${SETTLEMENT_S3_SECRET_KEY:}
      bucket: ${SETTLEMENT_BUCKET:settlements}

  security:
    jwt:
      issuer: ${JWT_ISSUER:food-delivery-platform}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8085/.well-known/jwks.json}

management:
  # Трассировка. Спаны собирает Micrometer Tracing поверх OpenTelemetry и отправляет по OTLP
  # в Tempo. Сквозной идентификатор trace живёт рядом с X-Correlation-Id, а не вместо него:
  # метка запроса — наша, она едет и через то, что трассировка не покрывает (outbox, очереди).
  tracing:
    sampling:
      # В локальном стеке — все запросы. В боевом этого слишком много: 0.1 и ниже.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  otlp:
    tracing:
      export:
        # Выключено по умолчанию: запуск из IDE и тесты не должны сыпать в лог ошибками
        # о недоступном Tempo. Docker Compose включает через TRACING_EXPORT_ENABLED=true.
        enabled: ${TRACING_EXPORT_ENABLED:false}
    metrics:
      export:
        # Метрики по-прежнему снимает Prometheus; стартер тянет OTLP-реестр метрик,
        # и без этой строки он слал бы то же самое второй раз.
        enabled: false
  server:
    port: ${MANAGEMENT_PORT:9086}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{userId:-}] "
  level:
    root: INFO
    com.dima.fooddelivery: DEBUG

# Клиент Camunda 8. Выключен по умолчанию: без SAGA_ENGINE=camunda он не нужен, а включённый
# пытался бы подключиться к брокеру и при старте, и в тестах.
camunda:
  client:
    enabled: ${CAMUNDA_CLIENT_ENABLED:false}
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8091}
    # gRPC, а не REST: по REST задания забираются длинным опросом, и клиент рвёт его по своему
    # же таймауту — в логе каждые 10 с «Failed to activate jobs ... SocketTimeoutException».
    prefer-rest-over-grpc: false
    worker:
      defaults:
        # Брокер сам отдаёт задание по открытому потоку, как только оно появилось: шаг процесса
        # выполняется сразу, а не на следующем опросе.
        stream-enabled: true
